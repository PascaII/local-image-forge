[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-ai-image-generator"
version = "0.1.0"
description = "Local Qwen Image 2.1 generation with style presets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "diffusers",
    "transformers>=5.17",
    "accelerate>=1.0",
    "pillow>=10.0",
]

[project.scripts]
local-image = "local_image_generator.cli:main"

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["local_image_generator"]
